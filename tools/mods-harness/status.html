<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F4F6; --panel:#FFFFFF; --ink:#18202C; --muted:#5B6576; --rule:#DADFE6;
  --accent:#2A4A7C; --done:#2F6B45; --run:#2A4A7C; --pause:#8A5A00; --err:#A3322A; --track:#E5E8ED;
  --sans:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111418; --panel:#191D23; --ink:#E4E8EE; --muted:#9AA3B2; --rule:#2B313A;
    --accent:#93B3E6; --done:#7FC79A; --run:#93B3E6; --pause:#E5B85C; --err:#F08A80; --track:#262B33; color-scheme:dark; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding:24px 16px 48px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:20px}
h1{font-size:22px;margin:0;font-weight:600}
h2{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:16px;display:grid;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kpi{display:grid;gap:2px}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums;font-weight:600}
.pill{display:inline-flex;gap:6px;align-items:center;font:600 12px var(--mono);padding:2px 9px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.s-DONE,.s-COMPLETE{color:var(--done)} .s-RUNNING,.s-IN_PROGRESS{color:var(--run)}
.s-PAUSED,.s-NEEDS_USER,.s-NEEDS_BRIAN,.s-BLOCKED{color:var(--pause)} .s-ERROR{color:var(--err)} .s-PENDING,.s-IDLE,.s-MISSING{color:var(--muted)}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.now{border-left:4px solid var(--run)}
.needs{border-left:4px solid var(--pause)}
.needs li{margin:4px 0}
ul{margin:0;padding-left:18px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
th{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.tbl{overflow-x:auto}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] summary .chev{transform:rotate(90deg)}
.chev{display:inline-block;transition:transform .15s}
.tasks{list-style:none;padding:8px 0 4px 0;margin:0;display:grid;gap:3px}
.tasks li{display:grid;grid-template-columns:28px 1fr;gap:6px;font-size:13px}
.mk{font-family:var(--mono);font-weight:600}
.t-x{color:var(--muted)} .t-x .mk{color:var(--done)}
.t-cur{font-weight:600} .t-cur .mk{color:var(--run)}
.warn{color:var(--pause);font-weight:600}
a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){.chev{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="title">Harness board</h1><div class="muted" id="sub">loading…</div></div>
    <div id="driver"></div>
  </div>

  <div class="grid3">
    <div class="panel kpi"><h2 id="k-unit-label">Units verified</h2><b id="k-bundles">–</b><div class="bar"><i id="k-bbar" style="width:0"></i></div></div>
    <div class="panel kpi"><h2>Tasks done (seeded units)</h2><b id="k-tasks">–</b><div class="bar"><i id="k-tbar" style="width:0"></i></div></div>
    <div class="panel kpi"><h2>Worker spend</h2><b id="k-cost">–</b><span class="muted" id="k-sessions"></span></div>
  </div>

  <div class="panel now" id="now"></div>
  <div class="panel needs" id="needs" hidden></div>

  <div class="panel">
    <h2 id="units-label">Units</h2>
    <div class="tbl"><table>
      <thead><tr><th id="th-unit">Unit</th><th>Status</th><th style="min-width:140px">Progress</th><th>Current task</th><th>Worker</th><th>Sessions</th><th>Spend</th><th>Files</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
  <div class="muted mono" id="foot"></div>
</div>

<script>
const DRY = new URLSearchParams(location.search).has('dry');
const open = new Set();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON = {DONE:'✓',COMPLETE:'✓',RUNNING:'▶',IN_PROGRESS:'▶',PAUSED:'‖',NEEDS_BRIAN:'?',NEEDS_USER:'?',BLOCKED:'■',ERROR:'✕',PENDING:'○',IDLE:'○',MISSING:'○'};
const pill = s => `<span class="pill s-${esc(s)}">${ICON[s]||'•'} ${esc(s)}</span>`;
const ago = iso => { if(!iso) return ''; const s=Math.round((Date.now()-new Date(iso))/1000);
  return s<60?`${s}s ago`:s<3600?`${Math.round(s/60)}m ago`:`${(s/3600).toFixed(1)}h ago`; };

async function get(path, json){
  try{ const r = await fetch('/'+path, {cache:'no-store'}); if(!r.ok) return null; return json? r.json() : r.text(); }
  catch{ return null; }
}
async function exists(path){ try{ return (await fetch('/'+path,{method:'HEAD',cache:'no-store'})).ok; }catch{ return false; } }

function parseTasks(md){
  const out = {status:'MISSING', tasks:[], needs:[]}; if(!md) return out;
  let sec = null;
  for(const line of md.split(/\r?\n/)){
    if(line.startsWith('Status:')) out.status = (line.slice(7).trim().split(/\s+/)[0]) || 'MISSING';
    else if(line.startsWith('## ')) sec = line.slice(3).trim().toLowerCase();
    else if(sec==='tasks'){ const m=line.match(/^- \[( |x|~)\] (T\d+)\b(.*)$/); if(m) out.tasks.push({s:m[1],id:m[2],text:m[3].trim()}); }
    else if(sec && sec.startsWith('needs')){ const m=line.match(/^- \[( |x)\] (N\d+)\b(.*)$/); if(m) out.needs.push({s:m[1],id:m[2],text:m[3].trim()}); }
  }
  return out;
}
const current = t => t.tasks.find(x=>x.s==='~') || t.tasks.find(x=>x.s===' ');

async function refresh(){
  let cfg = null;
  try{ const r = await fetch('loop.json',{cache:'no-store'}); if(r.ok) cfg = await r.json(); }catch{}
  if(!cfg){ document.getElementById('sub').textContent='Cannot read loop.json. Serve the repo root with: python <harness dir>/harness.py serve'; return; }
  const USER = cfg.user || 'user', UNIT = cfg.unitWord || 'unit', cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  document.getElementById('k-unit-label').textContent = cap(UNIT)+'s verified';
  document.getElementById('units-label').textContent = cap(UNIT)+'s';
  document.getElementById('th-unit').textContent = cap(UNIT);
  document.title = cfg.title + ' board';
  const sdir = cfg.harnessDir + (DRY ? '/dryrun-state' : '');
  const state = await get(sdir + '/state.json', true);
  const list = DRY ? [cfg.dryRun] : cfg.units;
  const ids = list.map(b=>b.id);
  const names = Object.fromEntries(list.map(b=>[b.id,b.name]));
  const backendOf = Object.fromEntries(list.map(b=>{ const w={...cfg.worker,...(b.worker||{})}; const m = (w.model && typeof w.model==='object') ? w.model[w.backend] : w.model; return [b.id, `${w.backend}${m?' · '+m:(w.tier?' · '+w.tier:'')}`]; }));
  document.getElementById('title').textContent = cfg.title + (DRY ? ' · dry run' : '') + ': harness board';

  const drv = state?.driver || {status:'IDLE', message:'The harness has not started (no state.json yet).'};
  const stale = drv.status==='RUNNING' && (Date.now()-new Date(drv.updated))/1000 > 180;
  document.getElementById('driver').innerHTML = pill(drv.status) + (stale?` <span class="warn">no driver update for ${ago(drv.updated)}; it may have died</span>`:'');
  document.getElementById('sub').innerHTML = esc(drv.message||'') + (state? ` <span class="mono">· state updated ${ago(drv.updated)}</span>`:'');

  const data = await Promise.all(ids.map(async id => {
    const bs = state?.units?.[id] || {status:'PENDING', sessions:0, costUsd:0};
    const t = bs.folder ? parseTasks(await get(bs.folder + '/TASKS.md')) : null;
    const handoff = bs.folder ? await exists(bs.folder + '/HANDOFF.md') : false;
    if(bs.model) backendOf[id] = `${bs.backend||''} · ${bs.tier?bs.tier+' · ':''}${bs.model}${(bs.escalations||[]).length?' ↑'+bs.escalations.length:''}`;
    return {id, name:names[id], bs, t, handoff};
  }));

  const doneB = data.filter(d=>d.bs.status==='DONE').length;
  let tDone=0, tAll=0, cost=0, sess=0;
  data.forEach(d=>{ if(d.t){ tAll+=d.t.tasks.length; tDone+=d.t.tasks.filter(x=>x.s==='x').length; } cost+=d.bs.costUsd||0; sess+=d.bs.sessions||0; });
  document.getElementById('k-bundles').textContent = `${doneB} / ${ids.length}`;
  document.getElementById('k-bbar').style.width = (100*doneB/ids.length)+'%';
  document.getElementById('k-tasks').textContent = tAll ? `${tDone} / ${tAll}` : '–';
  document.getElementById('k-tbar').style.width = tAll ? (100*tDone/tAll)+'%' : '0';
  const unpriced = data.reduce((a,d)=>a+(d.bs.unpricedSessions||0),0);
  document.getElementById('k-cost').textContent = '$' + cost.toFixed(2) + (unpriced?` + ${unpriced} unpriced`:'');
  const toks = data.reduce((a,d)=>a+(d.bs.tokens||0),0);
  const tcap = cfg.worker.totalTokens;
  document.getElementById('k-sessions').textContent = `${sess} worker session${sess===1?'':'s'}`
    + (toks||tcap?` · ${toks.toLocaleString()} uncached tokens${tcap?' of '+tcap.toLocaleString():''}`:'')
    + (cfg.worker.totalBudgetUsd?` · cap $${cfg.worker.totalBudgetUsd}`:'')
    + (unpriced?` · ${unpriced} session${unpriced===1?'':'s'} cut off before a cost record (the $ undercounts)`:'');

  const cur = data.find(d=>d.id===state?.current) || data.find(d=>d.bs.status!=='DONE');
  const nowEl = document.getElementById('now');
  if(drv.status==='COMPLETE'){ nowEl.innerHTML = `<h2>Now</h2><div>${pill('COMPLETE')} All ${UNIT}s are done and verified.</div>`; }
  else if(cur){
    const ct = cur.t ? current(cur.t) : null, hb = cur.bs.heartbeat;
    nowEl.innerHTML = `<h2>Now</h2>
      <div><b>${esc(cur.id)} · ${esc(cur.name)}</b> ${pill(cur.bs.status)} ${cur.t?pill(cur.t.status):''}</div>
      <div>Current task: ${ct ? `<span class="mono">${esc(ct.id)}</span> ${esc(ct.text)}` : '<span class="muted">task list not seeded yet</span>'}</div>
      ${hb ? `<div class="muted">Worker activity: <span class="mono">${esc(hb.tool)}</span> ${esc(hb.hint)} · ${ago(hb.at)}</div>` : ''}
      ${cur.bs.message ? `<div class="warn">${esc(cur.bs.message)}</div>` : ''}`;
  } else nowEl.innerHTML = '<h2>Now</h2><div class="muted">Idle.</div>';

  const needs = data.flatMap(d => (d.t?.needs||[]).filter(n=>n.s===' ').map(n=>({...n, b:d.id})));
  const nEl = document.getElementById('needs');
  nEl.hidden = !needs.length;
  nEl.innerHTML = `<h2>Waiting on ${esc(USER)}</h2><ul>${needs.map(n=>`<li><span class="mono">${esc(n.b)} ${esc(n.id)}</span> ${esc(n.text)}</li>`).join('')}</ul>`;

  document.getElementById('rows').innerHTML = data.map(d=>{
    const n = d.t?.tasks.length||0, x = d.t?.tasks.filter(t=>t.s==='x').length||0, ct = d.t?current(d.t):null;
    const list = d.t ? `<ul class="tasks">${d.t.tasks.map(t=>`<li class="${t.s==='x'?'t-x':(t===ct?'t-cur':'')}"><span class="mk">${t.s==='x'?'[x]':t.s==='~'?'[~]':'[ ]'}</span><span><span class="mono">${esc(t.id)}</span> ${esc(t.text)}</span></li>`).join('')}</ul>` : '';
    const files = d.bs.folder ? ['TASKS.md','HANDOFF.md','RUNLOG.md'].map(f=> f==='HANDOFF.md'&&!d.handoff ? '' : `<a href="/${d.bs.folder}/${f}" target="_blank">${f.replace('.md','')}</a>`).filter(Boolean).join(' · ') : '';
    return `<tr><td><details data-id="${d.id}" ${open.has(d.id)?'open':''}><summary><span class="chev">›</span> <b>${esc(d.id)}</b> ${esc(d.name)}</summary>${list}</details></td>
      <td>${pill(d.bs.status)}</td>
      <td><div class="bar"><i style="width:${n?100*x/n:0}%"></i></div><span class="mono muted">${n?`${x}/${n}`:'not started'}</span></td>
      <td>${ct?`<span class="mono">${esc(ct.id)}</span> ${esc(ct.text.slice(0,70))}${ct.text.length>70?'…':''}`:''}</td>
      <td class="mono">${esc(backendOf[d.id])}</td><td class="num">${d.bs.sessions||0}</td><td class="num">$${(d.bs.costUsd||0).toFixed(2)}</td><td>${files}</td></tr>`;
  }).join('');
  document.querySelectorAll('details[data-id]').forEach(el=>el.addEventListener('toggle',()=>{ el.open?open.add(el.dataset.id):open.delete(el.dataset.id); }));
  document.getElementById('foot').textContent = `Refreshed ${new Date().toLocaleTimeString()} · every 5 s · reads state.json and each ${UNIT}'s TASKS.md${DRY?' · ?dry':''}`;
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
